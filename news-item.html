<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новость — Лицей №1 им. М.В. Карамаева (v1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="demo-look.css"><!-- только для демо -->
  <script src="demo-look.js"></script><!-- только для демо; первым — сохранённые цвета применяются до отрисовки -->
  <script src="school-data.js"></script>
  <script src="components.js"></script>
  <script src="layout.js"></script>
</head>
<body data-nav="Наша жизнь/Новости">

<!-- Общие части (сайдбар, шапка, подвал) — теги-заглушки, разметку подставляет layout.js -->
<div class="app">
  <site-sidebar></site-sidebar>
  <div class="main">
    <site-header></site-header>

    <main class="content" id="main">

      <!-- на больших экранах «Читайте также» — колонка справа от фото и текста, иначе — строка под новостью -->
      <div class="article-layout">

      <!-- ================= НОВОСТЬ: крошки, заголовок, дата и просмотры, фото, текст ================= -->
      <article class="article" aria-labelledby="article-title">
        <div class="page-head">
          <nav class="crumbs" aria-label="Хлебные крошки">
            <ol>
              <li><a href="./">Главная</a></li>
              <li><a href="#">Наша жизнь</a></li>
              <li><a href="news.html">Новости</a></li>
            </ol>
          </nav>
          <h1 class="page-title article-title" id="article-title"></h1>
          <div class="article-meta">
            <time id="article-date"></time>
            <span class="article-views" id="article-views" hidden><i class="i i-eye" aria-hidden="true"></i><span class="sr-only">Просмотров:</span> <span data-views></span></span>
          </div>
        </div>
        <div class="article-main">
          <div class="article-photos" id="article-photos"></div>
          <div class="article-body prose" id="article-body"></div><!-- текст из CMS: стили .prose -->
          <a class="more more--back article-back" href="news.html"><i class="i i-left" aria-hidden="true"></i>Все новости</a>
        </div>
      </article>

      <!-- ================= ЧИТАЙ ТАКЖЕ: новости, близкие по дате ================= -->
      <section class="section related" id="related" aria-labelledby="related-title">
        <div class="section-head">
          <h2 id="related-title">Читайте также</h2>
        </div>
        <div class="news-grid" id="related-grid"></div>
      </section>

      </div>

    </main>

    <site-footer></site-footer>
  </div>
</div>

<demo-look></demo-look><!-- только для демо: панель «Внешний вид» -->

<script src="news-data.js"></script>
<script src="news-articles.js"></script>
<script src="page-article.js"></script>
<script src="site.js"></script>
</body>
</html>
