<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фотоальбом — Лицей №1 им. М.В. Карамаева (v5)</title>
  <link rel="stylesheet" href="fonts/fonts.css"><!-- шрифты — с сервера сайта -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="vendor/fancybox/fancybox.css"><!-- лайтбокс Fancybox -->
  <link rel="stylesheet" href="demo-look.css"><!-- только для демо -->
  <script src="demo-look.js"></script><!-- только для демо; первым — сохранённые цвета применяются до отрисовки -->
  <script src="a11y.js"></script><!-- версия для слабовидящих: сохранённые настройки — до отрисовки -->
  <script src="school-data.js"></script>
  <script src="components.js"></script>
  <script src="layout.js"></script>
</head>
<body data-nav="Наша жизнь/Фотогалерея">

<!-- Общие части (сайдбар, шапка, подвал) — теги-заглушки, разметку подставляет layout.js -->
<div class="app">
  <site-sidebar></site-sidebar>
  <div class="main">
    <site-header></site-header>

    <main class="content" id="main">

      <!-- ================= ЗАГОЛОВОК: хлебные крошки, h1 — название альбома, дата и число фото ================= -->
      <div class="page-head">
        <nav class="crumbs" aria-label="Хлебные крошки">
          <ol>
            <li><a href="./">Главная</a></li>
            <li><a href="#">Наша жизнь</a></li>
            <li><a href="photos.html">Фотогалерея</a></li>
          </ol>
        </nav>
        <h1 class="page-title" id="album-title">Фотоальбом</h1>
        <div class="article-meta">
          <time id="album-date"></time>
          <span class="article-views"><i class="i i-camera" aria-hidden="true"></i><span id="album-count"></span></span>   <!-- иконка с числом — как просмотры у новости -->
        </div>
      </div>

      <!-- ================= ФОТОГРАФИИ: в своих пропорциях, колонками; каждое следующее фото — в самую короткую колонку ================= -->
      <section class="album" aria-labelledby="album-title">
        <div class="photo-masonry" id="photo-masonry"><!-- строится из ALBUMS (photo-data.js) скриптом page-album.js --></div>
        <nav class="pager" id="pager" aria-label="Страницы альбома"></nav>
      </section>

    </main>

    <site-footer></site-footer>
  </div>
</div>

<demo-look></demo-look><!-- только для демо: панель «Внешний вид» -->

<script src="photo-data.js"></script>
<script src="vendor/fancybox/fancybox.umd.js"></script>
<script src="fancybox-setup.js"></script>
<script src="page-album.js"></script>
<script src="site.js"></script>
</body>
</html>
